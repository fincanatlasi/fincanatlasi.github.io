<!DOCTYPE html>
<!--
  GitHub Pages has no rewrites, so every link that is not a real file lands here:
    /f/<token>     share link (WhatsApp)  → store, referrer "share=<token>"
    /davet/<code>  invite link            → store, referrer "code=<code>"
  The reading is never shown on the web; it opens only in the app (the goal is installs).
    - App installed: verified App Links (/.well-known/assetlinks.json) open the app; this page never loads.
    - Android without the app: straight to Google Play with the referrer; on first launch the app reads it
      (Play install referrer), opens the shared reading and credits the invite.
    - iPhone: App Store; after installing, tapping the link again opens the app (Universal Links).
  Anything else shows a plain "page not found" with a link home.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Fincan Atlası</title>
<meta property="og:title" content="Fincan Atlası">
<meta property="og:description" content="Bir arkadaşın fincan falını seninle paylaştı ☕">
<meta property="og:image" content="https://fincanatlasi.github.io/assets/og_image.png">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --plum: #2A1628; --plum-deep: #1E0F1C; --orange: #F97316; --peach: #FFEDD5; --cream: #FFF8ED;
    --cream-dim: rgba(255,248,237,0.72); --orange-dim: rgba(249,115,22,0.55); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 20% 0%, rgba(249,115,22,0.14), transparent 55%),
      linear-gradient(180deg, var(--plum-deep) 0%, var(--plum) 100%);
    color: var(--cream); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2.5rem 1.25rem; max-width: 440px; margin: 0 auto; width: 100%; }
  main img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 6px 22px rgba(0,0,0,0.4); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.7rem; line-height: 1.3;
    margin: 1.3rem 0 0.6rem; }
  p { margin: 0; color: var(--cream-dim); line-height: 1.55; }
  .buttons { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1.6rem; width: 100%; }
  .btn { display: block; padding: 0.9rem 1rem; border-radius: 14px; font-weight: 700; text-decoration: none;
    background: var(--orange); color: #fff; }
  .btn.secondary { background: transparent; color: var(--cream); border: 1.5px solid rgba(255,248,237,0.35); }
  .note { font-size: 0.88rem; margin-top: 1.1rem; }
  footer { text-align: center; padding: 1.5rem; font-size: 0.85rem; color: var(--cream-dim); }
  footer .signature { display: block; font-family: "Dancing Script", "Brush Script MT", cursive;
    font-size: 1.35rem; color: var(--orange-dim); margin-top: 0.5rem; }
</style>
</head>
<body>
<main>
  <img src="/assets/app_icon.png" alt="Fincan Atlası">
  <h1 id="title"></h1>
  <p id="body"></p>
  <div class="buttons" id="buttons"></div>
  <p class="note" id="note"></p>
</main>
<footer>
  &copy; 2026 Fincan Atlası
  <span class="signature">A. Köseoğlu</span>
</footer>
<script>
(() => {
  // ---- CONFIG ------------------------------------------------------------------------------------
  const CONFIG = {
    playStoreUrl: 'https://play.google.com/store/apps/details?id=app.fincanatlasi',
    appStoreUrl: '', // fill when the iOS app is published, e.g. https://apps.apple.com/app/id0000000000
  };
  // ---------------------------------------------------------------------------------------------------

  const tr = /^tr\b/i.test(navigator.language || '');
  const L = tr ? {
    shareTitle: 'Bir arkadaşın fincan falını seninle paylaştı ☕',
    shareBody: 'Falı görmek için Fincan Atlası uygulamasını indir. Uygulama açılınca paylaşılan fal seni bekliyor olacak.',
    inviteTitle: 'Fincan Atlası’na davet edildin ☕',
    inviteBody: 'Uygulamayı indir, fincanının fotoğrafını çek; telvedeki sembolleri işaretli olarak gör.',
    play: 'Google Play’den indir', ios: 'App Store’dan indir', home: 'Ana sayfaya dön',
    iosNote: 'Uygulamayı yükledikten sonra WhatsApp’taki linke tekrar dokun.',
    desktopNote: 'Linki telefonundan aç.',
    notFoundTitle: 'Sayfa bulunamadı', notFoundBody: 'Aradığın sayfa taşınmış ya da hiç olmamış olabilir.',
  } : {
    shareTitle: 'A friend shared their coffee cup reading with you ☕',
    shareBody: 'Get the Fincan Atlası app to see it. The shared reading will be waiting when the app opens.',
    inviteTitle: 'You are invited to Fincan Atlası ☕',
    inviteBody: 'Get the app, take a photo of your cup and see the symbols in your grounds, marked.',
    play: 'Get it on Google Play', ios: 'Download on the App Store', home: 'Go to the home page',
    iosNote: 'After installing, tap the link in WhatsApp again.',
    desktopNote: 'Open the link on your phone.',
    notFoundTitle: 'Page not found', notFoundBody: 'The page you are looking for may have moved or never existed.',
  };
  if (!tr) document.documentElement.lang = 'en';
  const $ = (id) => document.getElementById(id);
  const button = (href, text, secondary) => {
    const a = document.createElement('a');
    a.className = secondary ? 'btn secondary' : 'btn';
    a.href = href;
    a.textContent = text;
    $('buttons').append(a);
  };

  const path = location.pathname;
  const share = (path.match(/^\/f\/([0-9a-f]{32})\/?$/) || [])[1];
  const invite = (path.match(/^\/davet\/([A-Za-z0-9]{6,10})\/?$/) || [])[1];

  if (!share && !invite) {
    $('title').textContent = L.notFoundTitle;
    $('body').textContent = L.notFoundBody;
    button('/', L.home);
    return;
  }

  $('title').textContent = share ? L.shareTitle : L.inviteTitle;
  $('body').textContent = share ? L.shareBody : L.inviteBody;
  const referrer = share ? `share=${share}` : `code=${invite.toUpperCase()}`;
  const playUrl = `${CONFIG.playStoreUrl}&referrer=${encodeURIComponent(referrer)}`;
  const ua = navigator.userAgent;

  if (/Android/i.test(ua)) {
    button(playUrl, L.play);
    location.replace(playUrl); // straight to the store; the button stays as a fallback
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    if (CONFIG.appStoreUrl) button(CONFIG.appStoreUrl, L.ios);
    $('note').textContent = L.iosNote;
  } else {
    button(playUrl, L.play);
    if (CONFIG.appStoreUrl) button(CONFIG.appStoreUrl, L.ios, true);
    $('note').textContent = L.desktopNote;
  }
})();
</script>
</body>
</html>
